; PlatformIO Project Configuration File
;
; Build environments:
;   esp32-c3-supermini       - Production (adaptive 5-60s intervals)
;   esp32-c3-supermini-debug - Bench testing (fixed 10s intervals)
;
; Usage:
;   pio run                                    # Build all
;   pio run -e esp32-c3-supermini -t upload    # Upload production
;   pio run -e esp32-c3-supermini-debug -t upload  # Upload debug
;   pio device monitor -b 115200               # Serial monitor
;
; See docs/validation.md for bench testing procedures.

; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-supermini-debug

; Shared settings
[common]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11

base_build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; Production environment (default)
[env:esp32-c3-supermini]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.base_build_flags}

; Debug/Test environment (shorter intervals for bench testing)
[env:esp32-c3-supermini-debug]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
	${common.base_build_flags}
	-DDEBUG_MODE
